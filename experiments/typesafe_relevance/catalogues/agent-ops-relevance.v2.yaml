id: agent-ops-relevance
decide: agent_ops_relevance/v1
description: >-
  agent-ops-relevance/v1 decision rule as System One questions. Revision of v1
  criteria text only: identical question ids, types and answer domains, so a
  v1-versus-v2 comparison isolates criteria quality. Every criterion carries
  examples; false criteria describe the confusable near-miss rather than the
  negation of the true criterion; Score levels are described as situations;
  the precedence instruction restores the ordering warning v1 dropped.
state:
  post: [platform, channel, url, text]
  parent_context_only: [author_name, text]
  author: [name, handle]
  project: [key, name, description]
questions:
  exclusion:
    type: choice
    instructions:
      question: Does the post's own text fall under a hard exclusion?
      judge: >-
        Judge the post's actual subject, not a matching word. Workload cost is an
        operations topic, not funding news. A post being thin, vague, off-topic or
        unoriginal is not a hard exclusion; only the categories below are.
    criteria:
      non_english:
        what: The post's text is mainly in a language other than English.
        not_for: >-
          English text quoting a foreign phrase, or English text containing code,
          identifiers, or non-English product names.
        examples:
          - Un hilo sobre cómo desplegamos agentes en producción
          - 本番環境でエージェントを運用した話
      coding_assistant:
        what: >-
          Personal productivity with a coding assistant — how well it writes,
          completes or refactors code for the author at their keyboard.
        not_for: >-
          Operating an agent that runs unattended, even when that agent writes code.
        examples:
          - Copilot saved me two hours refactoring this module
          - Comparing Cursor and Windsurf for day-to-day editing
      hardware:
        what: Chips, GPUs, devices or datacenter hardware as the post's subject.
        not_for: >-
          The cost or capacity of running a workload, which is an operations topic.
        examples:
          - The new accelerator ships with 192GB of memory
          - Benchmarks across two GPU generations
      funding_or_market:
        what: >-
          Funding rounds, valuations, acquisitions, share prices, or market-size
          commentary.
        not_for: >-
          What it costs to run a workload, which is an operations topic rather than
          market news.
        examples:
          - Series B closed at a $2B valuation
          - The agent tooling market will be worth $40B by 2030
      event_promo:
        what: >-
          Promotion of a conference, meetup, webinar, livestream, workshop or course.
        not_for: >-
          A post that reports a specific finding that happened to be presented at an
          event.
        examples:
          - Join our webinar on agent reliability, Thursday 2pm
          - Early-bird tickets close Friday
      hype:
        what: >-
          Enthusiasm, slogans, predictions or vibes carrying no specific claim,
          number, mechanism or result.
        not_for: >-
          A short post that still names a specific behaviour, number or failure. Also
          not an on-topic link, announcement or agreement that makes no point of its
          own — that is not a hard exclusion.
        examples:
          - Agents are going to change everything
          - 2026 is the year of the agent
      none:
        what: >-
          No hard exclusion applies. Choose this whenever the post is in English and
          its subject is none of the categories above — including posts that are
          thin, off-topic, unoriginal, or make no point at all.
        examples:
          - A bare link to someone else's post about tracing agents
          - A detailed thread about retry policy in production
  topic_production_failures:
    type: noul
    instructions: >-
      Is the post about something going wrong with an agent that is actually running?
    criteria:
      true:
        what: >-
          An incident, regression, outage, silent failure or reliability problem in a
          deployed or running agent system.
        examples:
          - our support agent started looping on refund requests after the tool schema changed
          - we saw a 3% task failure rate in production that never showed up in testing
      false:
        what: >-
          The post concerns agents but not the failure of one that is running —
          model failures on a benchmark, bugs in a local prototype, or a general
          worry that agents are unreliable.
        examples:
          - this model scores poorly on tool-use benchmarks
          - agents just aren't reliable enough yet
  topic_observability:
    type: noul
    instructions: Is the post about seeing what a running agent actually did?
    criteria:
      true:
        what: >-
          Tracing, logging, monitoring, telemetry, replay, or diagnosing a specific
          agent run.
        examples:
          - added span-level tracing so we can see which tool call burned the context
          - we log every tool result now, which is how we found the bad retry
      false:
        what: >-
          Instrumentation unrelated to observing agent behaviour — ordinary
          application logging, dashboards for non-agent services, or naming a tracing
          vendor without an agent-observability point.
        examples:
          - set up Grafana for our web tier
          - OpenTelemetry shipped a new release today
  topic_unreliable_tools:
    type: noul
    instructions: >-
      Is the post about tools or external calls an agent depends on failing or
      behaving unpredictably?
    criteria:
      true:
        what: >-
          Retries, timeouts, rate limits, partial failures, idempotency, or flaky
          tool execution in an agent's dependencies.
        examples:
          - the agent retried a non-idempotent payment call twice
          - we cap tool latency at 8s or the whole run stalls behind it
      false:
        what: >-
          Tool use in general — which tools an agent has, how a tool is defined, or
          how well the model picks one — with no point about unreliability.
        examples:
          - gave the agent a search tool and a calculator
          - function-calling accuracy improved with the new model
  topic_orchestration_state:
    type: noul
    instructions: >-
      Is the post about how work is coordinated across steps or agents, or how state
      survives between them?
    criteria:
      true:
        what: >-
          Multi-agent handoff, durable execution, checkpointing, resumption after
          failure, queues, or scheduling of agent work.
        examples:
          - we checkpoint after each tool call so a crash resumes instead of restarting
          - handing context from the planner to the executor loses the original constraint
      false:
        what: >-
          Agent architecture described with no point about coordinating work or
          keeping state — naming a framework, or describing what an agent does end to
          end.
        examples:
          - built a research agent with a planner and a writer
          - LangGraph or CrewAI, what's everyone using?
  topic_guardrails_credentials:
    type: noul
    instructions: >-
      Is the post about limiting what a running agent is allowed to do or reach?
    criteria:
      true:
        what: >-
          Permissions, sandboxing, secret scope, credential handling, tool
          allow-lists, or runtime policy applied to an agent.
        examples:
          - scoped the agent's token to one repo after it opened a PR against the wrong one
          - every shell command the agent proposes runs in a sandbox
      false:
        what: >-
          Security or safety with no reference to constraining an agent at runtime —
          model alignment, prompt injection as a research topic, or company security
          posture.
        examples:
          - prompt injection is still an unsolved problem
          - we're SOC 2 compliant now
  topic_approval_audit_deploy:
    type: noul
    instructions: >-
      Is the post about getting agent work reviewed, recorded or released?
    criteria:
      true:
        what: >-
          Human approval steps, audit trails, rollback, staged rollout, or change
          review applied to agent behaviour.
        examples:
          - every agent-opened PR needs a human approval before merge
          - we rolled the new prompt back an hour after release
      false:
        what: >-
          Ordinary software deployment or code review with no agent in the loop, or a
          general statement that humans should stay involved.
        examples:
          - our CI pipeline deploys on green
          - humans should always be in the loop
  topic_cost_capacity:
    type: noul
    instructions: >-
      Is the post about what running the workload costs, or what it takes to keep up
      with it?
    criteria:
      true:
        what: >-
          Token or request spend for real work, per-task cost, throughput,
          concurrency limits, queue depth, or capacity planning.
        examples:
          - each support ticket costs us about 40 cents in tokens
          - we cap concurrency at 20 or the queue backs up within minutes
      false:
        what: >-
          Model or API list pricing quoted on its own, or a general remark that
          agents are expensive, with no measured or managed workload behind it.
        examples:
          - the new model is 5x cheaper per million tokens
          - running agents gets expensive fast
  topic_evals_vs_deployment:
    type: noul
    instructions: >-
      Is the post about the gap between how an agent scores in evaluation and how it
      behaves once deployed?
    criteria:
      true:
        what: >-
          Eval blind spots, production behaviour diverging from test results, or
          deciding whether something is ready to ship.
        examples:
          - it passed every eval and still failed on the first real customer thread
          - our eval set had no multi-turn cases, which is exactly where it broke
      false:
        what: >-
          Evaluation discussed on its own — benchmark results, how to build an eval
          set, leaderboard commentary — with no comparison to deployed behaviour.
        examples:
          - we built a 200-case eval harness this week
          - new state of the art on SWE-bench
  operational_claim:
    type: noul
    instructions: >-
      Does the post's own text state something specific about running agents?
    criteria:
      true:
        what: >-
          A concrete failure and what caused it, a measured result, or a definite
          finding from operating a system.
        examples:
          - switching to a 30s timeout cut stalled runs from 8% to under 1%
          - the agent double-charged because our retry wasn't idempotent
      false:
        what: >-
          Operational language appears but nothing particular is asserted — a topic
          is named, a tool is mentioned, or a general truth is restated without a
          specific claim, number or cause.
        examples:
          - observability really matters for agents in production
          - retries are important when your tools are flaky
  reasoned_practice:
    type: noul
    instructions: >-
      Does the post describe something the author does when operating agents, and say
      why they do it?
    criteria:
      true:
        what: A concrete operating practice together with the reason behind it.
        examples:
          - we checkpoint before every tool call, because a crash halfway otherwise replays the side effects
          - we cap the agent at three retries so a flapping API can't burn the whole budget
      false:
        what: >-
          A practice named with no reason, or a reason with no practice — including
          advice phrased as a rule the author never ties to a cause.
        examples:
          - always add retries
          - monitoring is essential
  operational_question:
    type: noul
    instructions: >-
      Does the post ask others a concrete question about how they handle an
      operational problem?
    criteria:
      true:
        what: >-
          A specific, answerable question about operating agent systems — how others
          handle a named problem or a stated situation.
        examples:
          - how are you all handling tool calls that time out mid-run?
          - what do you checkpoint when an agent spans multiple services?
      false:
        what: >-
          A rhetorical question, an engagement prompt, or a question so broad that no
          particular answer would settle it.
        examples:
          - are agents actually working for anyone yet?
          - what's everyone building this week?
  point_in_own_text:
    type: noul
    instructions: >-
      Reading only the words of the post itself — ignoring any linked page, image,
      quoted title or parent post — is the substantive point present in those words?
    criteria:
      true:
        what: >-
          The post's own words carry the point. Deleting the link, image or parent
          would leave the substance intact.
        examples:
          - we cut stalled runs from 8% to 1% by lowering the tool timeout — writeup here
          - three things broke moving the agent to production, retries, secret scope, and context handoff
      false:
        what: >-
          The post's own words only point at where the substance is — a bare link, a
          restated headline, a remark on an image, or a reply that merely agrees or
          reacts. Delete the link, image or parent and nothing substantive remains.
        examples:
          - great writeup on agent reliability
          - this, exactly what we've been seeing
  on_topic_pointer:
    type: noul
    instructions: >-
      Is this on-topic for operating agents while making no point of its own?
    criteria:
      true:
        what: >-
          A link, release or paper announcement, roundup, name-check, or agreeing
          reply about operating agents whose own text asserts nothing.
        examples:
          - we just shipped v2 of our agent observability SDK
          - great thread on durable execution, worth reading
          - "+1, we've seen exactly the same"
      false:
        what: >-
          The post makes a point of its own, however brief — or it is not about
          operating agents at all.
        examples:
          - their post is right about checkpointing but misses that retries must be idempotent too
          - a thread about transformer architecture
  general_building:
    type: noul
    instructions: >-
      Is this about constructing agents, with nothing about running one?
    criteria:
      true:
        what: >-
          Prompts, frameworks, architectures, model choice, capabilities or demos,
          with no point about operating a deployed agent.
        examples:
          - here's the prompt structure I use for a research agent
          - swapped in the new model and the demo is much sharper
      false:
        what: >-
          The post concerns operating an agent that runs — or it is not about agents
          at all.
        examples:
          - our deployed agent drops the original constraint during context handoff
  band:
    type: score
    instructions:
      question: >-
        Which situation best describes this post? Apply the tests in order and stop
        at the first that fits.
      apply_in_order:
        - A hard exclusion applies, or the post has nothing to do with operating agents — lowest level.
        - The post's own text makes a specific operational point — highest level.
        - The post is on topic for operating agents but its own text makes no point — third level.
        - The post is about building agents with no operational point — second level.
      note: >-
        Judge the post's own words. Parent context can clarify what the post refers
        to but cannot supply a point the post does not make. Do not apply a broad
        "is this about operating agents" test before the building level — general
        agent-building content belongs at the building level, not the lowest one.
    criteria:
      - summary: >-
          Nothing to do with operating agents, or a hard exclusion applies — another
          language, personal coding-assistant productivity, hardware, funding and
          market news, event promotion, or pure hype.
        signals:
          - the subject sits outside agent operations entirely
          - an exclusion category fits the post's actual subject
      - summary: >-
          About building agents — prompts, frameworks, architectures, model choice,
          demos — with nothing about running one.
        signals:
          - construction rather than operation
          - no deployed or running system is in view
      - summary: >-
          On topic for operating agents, but the post's own text makes no point of
          its own — it links, announces, rounds up, name-checks or agrees.
        signals:
          - the substance sits in a link, title, image or the parent post
          - the post reacts or endorses rather than states
      - summary: >-
          The post's own text makes a specific operational point — a concrete claim
          or result, a failure and its cause, a practice with its reason, or a
          concrete question about how others operate agents.
        signals:
          - a specific claim, number, cause or practice appears in the post's own words
          - deleting any link or parent would leave the point standing
  account_type:
    type: choice
    instructions:
      question: >-
        What kind of account is this, judged only from the display name and handle?
      judge: >-
        Use only the display name and handle. Do not use the post's text. A display
        name and handle are thin evidence: when they do not distinguish between
        kinds, spread probability across the plausible kinds rather than choosing
        one confidently. This annotation must not affect relevance.
    criteria:
      individual_practitioner:
        what: >-
          A personal name, or a handle reading as a person, with nothing marking it
          as a company, feed or bot.
        examples:
          - Jane Okafor / @jokafor
          - dave / @dave.bsky.social
      brand_or_company:
        what: A product, vendor, project or organisation name.
        not_for: A personal name that merely mentions an employer.
        examples:
          - Acme Observability / @acmeobs
          - Vectorly / @vectorly
      aggregator_or_feed:
        what: >-
          A name or handle marking automated collection or republication — news,
          feed, daily, weekly, digest, wire, alerts, arxiv.
        examples:
          - AI Daily / @aidaily
          - Agent News Wire / @agentwire
      executive_or_founder_voice:
        what: >-
          A personal name whose name or handle states an executive or founder role.
        not_for: >-
          A personal name with no stated role, which is an individual practitioner.
        examples:
          - Sam Rivera, CEO Acme / @samrivera
          - founder @ Vectorly / @jlin
      bot:
        what: >-
          The name or handle states that the account is automated — bot, :bot:,
          {bot}, or an explicit bridge marker.
        examples:
          - paper-bot / @paperbot
          - digest {bot} / @digestbot
