name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - run: uv sync --locked --extra review
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run python -m assay.schema_export --check
      - run: uv run pytest -q
      - run: uv build

  core-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - name: Build the core wheel without a JavaScript toolchain
        run: |
          clean_path="$(mktemp -d "$RUNNER_TEMP/assay-core-bin.XXXXXX")"
          ln -s "$(command -v uv)" "$clean_path/uv"
          ! PATH="$clean_path" command -v node
          ! PATH="$clean_path" command -v npm
          ! PATH="$clean_path" command -v bun
          PATH="$clean_path" uv build --wheel
          wheel_path="$(realpath dist/*.whl)"
          cd "$RUNNER_TEMP"
          uv venv --python 3.13 assay-core
          uv pip install --python assay-core/bin/python "$wheel_path"
          assay-core/bin/python - <<'PY'
          from importlib.metadata import distribution
          from importlib.util import find_spec
          from importlib.resources import files

          import assay.review

          assert find_spec("fastapi") is None
          installed = distribution("assay").files or ()
          assert any(str(path).startswith("assay/schemas/") for path in installed)
          static = files("assay.review").joinpath("static")
          assert static.is_dir()
          assert {path.name for path in static.iterdir()} >= {"index.html", "app.js", "app.css"}
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - run: uv sync --locked --extra review
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.10"
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bun run typecheck
      - working-directory: web
        run: bun run test
      - working-directory: web
        run: bunx playwright install --with-deps chromium
      - working-directory: web
        run: bun run test:browser
