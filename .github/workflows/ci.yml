name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - run: uv sync --locked --extra review
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run python -m assay.schema_export --check
      - run: uv run pytest -q
      - run: uv build

  core-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - name: Build the core wheel without a JavaScript toolchain
        run: |
          clean_path="$(dirname "$(command -v uv)"):/usr/bin:/bin"
          PATH="$clean_path" uv build --wheel
          ! PATH="$clean_path" command -v node
          wheel_path="$(realpath dist/*.whl)"
          cd "$RUNNER_TEMP"
          PATH="$clean_path" uv venv --python 3.13 assay-core
          PATH="$clean_path" uv pip install --python assay-core/bin/python "$wheel_path"
          assay-core/bin/python - <<'PY'
          from importlib.metadata import distribution
          from importlib.resources import files

          import assay.review

          installed = distribution("assay").files or ()
          assert any(str(path).startswith("assay/schemas/") for path in installed)
          static = files("assay.review").joinpath("static")
          assert static.is_dir()
          assert static.joinpath(".gitkeep").read_bytes() == b""
          PY
