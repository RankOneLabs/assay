name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/node-tools/package-lock.json
      # Both extras: mypy/pytest exercise the legacy Jig/OpenRouter adapters and
      # investigations too, not just the core+review surface. core-wheel below
      # separately proves the published wheel needs neither by default.
      - run: uv sync --locked --extra review --extra legacy --extra code-metrics
      - name: Install locked Node analyzers for the root pytest suite
        run: uv run assay code-metrics install-node-tools
      - name: Prepare dependency cache for offline wheel acceptance
        run: |
          uv build --wheel
          packaging_env="$(mktemp -d "$RUNNER_TEMP/assay-packaging.XXXXXX")"
          uv venv --python 3.13 "$packaging_env/venv"
          wheel_path="$(realpath dist/*.whl)"
          uv pip install --python "$packaging_env/venv/bin/python" "$wheel_path[review]"
      - run: uv run ruff check src tests experiments
      - run: uv run mypy src
      - run: uv run python -m assay.schema_export --check
      - run: uv run pytest -q
      - run: uv build

  core-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - name: Build the core wheel without a JavaScript toolchain
        run: |
          clean_path="$(mktemp -d "$RUNNER_TEMP/assay-core-bin.XXXXXX")"
          ln -s "$(command -v uv)" "$clean_path/uv"
          ! PATH="$clean_path" command -v node
          ! PATH="$clean_path" command -v npm
          ! PATH="$clean_path" command -v bun
          PATH="$clean_path" uv build --wheel
          wheel_path="$(realpath dist/*.whl)"
          cd "$RUNNER_TEMP"
          uv venv --python 3.13 assay-core
          uv pip install --python assay-core/bin/python "$wheel_path"
          assay-core/bin/python - <<'PY'
          from importlib.metadata import distribution
          from importlib.util import find_spec
          from importlib.resources import files
          import subprocess

          import assay.review
          import assay.code_metrics.errors
          import assay.code_metrics.pins
          import assay.code_metrics.models

          assert find_spec("fastapi") is None
          assert find_spec("grimp") is None
          assert find_spec("assay.code_metrics") is not None
          installed = distribution("assay").files or ()
          assert any(str(path) == "assay/code_metrics/models.py" for path in installed)
          assert assay.code_metrics.models.CodeMetricsReportV2
          result = subprocess.run(
              ["assay-core/bin/assay", "code-metrics", "snapshot", "."],
              capture_output=True, text=True,
          )
          assert result.returncode != 0
          assert "install assay[code-metrics]" in result.stdout
          assert "Traceback" not in result.stderr
          assert any(str(path).startswith("assay/schemas/") for path in installed)
          static = files("assay.review").joinpath("static")
          assert static.is_dir()
          assert {path.name for path in static.iterdir()} >= {"index.html", "app.js", "app.css"}
          PY

  frontend:
    # Playwright 1.55.0 refuses to install chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - run: uv sync --locked --extra review
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.10"
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bun run typecheck
      - working-directory: web
        run: bun run test
      - working-directory: web
        run: bunx playwright install --with-deps chromium
      - working-directory: web
        run: bun run test:browser
      # web/scripts/build.ts writes into this tracked directory; status also catches new files.
      - run: |
          static_status="$(git status --porcelain --untracked-files=all -- src/assay/review/static)"
          if [ -n "$static_status" ]; then
            printf '%s\n' "$static_status"
            exit 1
          fi

  # The experiments suite runs as parallel shards. experiments-plan names the
  # shards once, fails if any test directory is in no shard, and drops the
  # finished-studies shard from pull requests that cannot affect it.
  experiments-plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, tomllib
          from pathlib import Path

          # code_extension is the active study. shared holds the code other
          # experiments import (code_extension imports verification_pilot and
          # workflow_edit; consistency_pilot imports code_metrics).
          # finished holds completed studies that nothing else imports.
          shards = {
              "code_extension": ["code_extension"],
              "shared": ["verification_pilot", "workflow_edit", "code_metrics", "pier_qualification"],
              "finished": ["consistency_pilot", "typesafe_relevance", "oakridge_history"],
          }
          assigned = [d for dirs in shards.values() for d in dirs]
          on_disk = {p.parent.name for p in Path("experiments").glob("*/tests")}
          config = tomllib.loads(Path("experiments/pyproject.toml").read_text())
          testpaths = {p.split("/")[0] for p in config["tool"]["pytest"]["ini_options"]["testpaths"]}
          missing = sorted((on_disk | testpaths) - set(assigned))
          duplicated = sorted({d for d in assigned if assigned.count(d) > 1})
          if missing or duplicated:
              raise SystemExit(
                  f"experiments shards out of date: unassigned {missing}, in two shards {duplicated};"
                  " edit experiments-plan in .github/workflows/ci.yml"
              )

          run_finished = True
          if os.environ["EVENT"] == "pull_request":
              changed = subprocess.run(
                  ["git", "diff", "--name-only", os.environ["BASE"], "HEAD"],
                  check=True, capture_output=True, text=True,
              ).stdout.split()
              gate = re.compile(
                  r"^(experiments/(consistency_pilot|typesafe_relevance|oakridge_history|code_metrics)/"
                  r"|experiments/(pyproject\.toml|uv\.lock|conftest\.py)$"
                  r"|src/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)"
              )
              run_finished = any(gate.match(path) for path in changed)
              print("finished studies:", "run" if run_finished else "skipped (no relevant change)")
          matrix = [
              {"name": name, "paths": " ".join(f"{d}/tests" for d in dirs)}
              for name, dirs in shards.items()
              if name != "finished" or run_finished
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"shards={json.dumps(matrix)}\n")
          PY

  experiments-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - name: Lint experiments with the root Ruff configuration
        run: uv run ruff check experiments
      - name: Sync the standalone experiments project
        working-directory: experiments
        run: uv sync --locked --group dev
      - name: Type-check experiments
        working-directory: experiments
        run: uv run mypy .

  experiments-tests:
    needs: experiments-plan
    runs-on: ubuntu-latest
    name: experiments-tests (${{ matrix.shard.name }})
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.experiments-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          # The workflow-edit metric tests npm ci the fixture image's lock too.
          cache-dependency-path: |
            vendor/node-tools/package-lock.json
            integrations/pier/workflow_edit/package-lock.json
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.10"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: vendor/node-tools
      - name: Sync the standalone experiments project
        working-directory: experiments
        run: uv sync --locked --group dev
      - name: Test ${{ matrix.shard.name }}
        working-directory: experiments
        env:
          ASSAY_REQUIRE_DOCKER: "1"
          SHARD_PATHS: ${{ matrix.shard.paths }}
        run: uv run pytest -q --durations=25 $SHARD_PATHS

  # Keeps one "experiments" status that is green only when lint and every
  # planned shard passed.
  experiments:
    if: always()
    needs: [experiments-plan, experiments-lint, experiments-tests]
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.experiments-plan.result }}
          LINT: ${{ needs.experiments-lint.result }}
          TESTS: ${{ needs.experiments-tests.result }}
        run: |
          echo "plan=$PLAN lint=$LINT tests=$TESTS"
          [ "$PLAN" = success ] && [ "$LINT" = success ] && [ "$TESTS" = success ]

  pier-qualification:
    # Deterministic offline, local-Docker, and fake-HTTP coverage only -- this
    # job never sets OPENROUTER_API_KEY or ASSAY_ALLOW_PAID_PIER, so every
    # paid-profile and paid-marker test in pier_qualification/tests/test_pier_acceptance.py stays
    # gated and skipped, and qualify_local.py's own probes never dial out.
    runs-on: ubuntu-latest
    env:
      # Docker, sudo and a LAN address are part of this job, so their absence
      # fails the Docker-backed tests instead of skipping them green.
      ASSAY_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.2"
          python-version: '3.13'
      - run: uv sync --locked --extra review --extra legacy
      - name: Lint the isolated bridge project too (root ruff config covers its tree)
        run: uv run ruff check integrations/pier
      - name: mypy over the qualification script (needs both projects' sources on MYPYPATH)
        run: MYPYPATH=integrations/pier/src:experiments uv run mypy integrations/pier/scripts/qualify_local.py
      - name: Verify the documented root qualification command resolves experiment imports
        run: uv run --extra review --extra legacy python integrations/pier/scripts/qualify_local.py --help
      - working-directory: experiments
        run: uv run --locked pytest -q pier_qualification/tests/test_pier_acceptance.py
      # The bridge is a deliberately separate uv workspace with its own
      # pyproject.toml/uv.lock (integrations/pier/README.md) -- synced,
      # type-checked, and tested against its own lock here, independent of
      # the root project's own dependency set above.
      - name: Sync the isolated bridge project's own locked dependencies
        working-directory: integrations/pier
        run: uv sync --locked --group dev
      - name: Type-check the isolated bridge project against its own lock
        working-directory: integrations/pier
        run: uv run mypy src
      - name: Run the full isolated bridge pytest suite
        working-directory: integrations/pier
        run: uv run pytest -q
