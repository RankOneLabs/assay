[project]
name = "assay-pier-bridge"
version = "0.1.0"
description = "Isolated Pier/mini-swe-agent bridge: one guarded trial per cell."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  # Exact upstream revision, not a floating version: the bridge image's
  # identity is the pinned commit, recorded again in README.md alongside the
  # resolved image digest.
  "mini-swe-agent @ git+https://github.com/SWE-agent/mini-swe-agent.git@a83fcae82d2a08f0ee0c688f9d137b3566c097f8",
  # The real Pier package: published to PyPI as "datacurve-pier" (import name
  # "pier") from github.com/datacurve-ai/pier, which the project itself
  # publishes no source repository for — an exact version plus uv.lock's
  # hash pin is this dependency's durable identity, the same role a commit
  # SHA plays for mini-swe-agent above. See README.md, "Pier revision".
  "datacurve-pier==0.3.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay_pier_bridge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true
